name: Computrabajo Costa Rica Scraper

on:
  workflow_dispatch: {}        # lets you trigger a run manually from the Actions tab
  schedule:
    # Runs every 15 minutes. Because of the concurrency group below, a new
    # scheduled trigger that fires while a run is still in progress gets
    # QUEUED (not dropped, not cancelled) — so the very next run starts the
    # instant the current one ends, giving you continuous back-to-back runs
    # without needing a self-retriggering token. Once every location has
    # been scraped, the script exits almost instantly (it sees
    # cr_SCRAPE_COMPLETE.flag and returns), so these scheduled ticks
    # become a harmless no-op that costs a few seconds of Actions minutes.
    - cron: "0 */6 * * *"

concurrency:
  # This MUST be unique per country. If every country workflow shared
  # the group name "computrabajo-scraper", GitHub Actions would treat all
  # country scrapers as ONE queue — only one country's run could ever be
  # in progress at a time, and the others would queue behind it indefinitely
  # instead of running in parallel.
  group: computrabajo-scraper-cr
  cancel-in-progress: false    # never kill a run in progress — queue behind it instead

permissions:
  contents: write               # needed to commit cr_processed.csv / cr_computrabajo_progress.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    # GitHub hard-kills a job at 360 minutes with no chance to save state, so
    # this must stay comfortably under that. The script's own internal
    # MAX_RUNTIME_SECONDS (below) stops it gracefully well before this fires.
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the rebase-before-push step below never fails on a shallow clone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (self-limiting runtime)
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
          # 20000s = ~5h33m. Leaves ~15+ min of headroom inside the 350-min
          # job timeout for checkout/setup/install (~1-2 min) and the commit
          # step below, so the script always has time to save progress and
          # exit cleanly on its own before GitHub would kill it mid-request.
          MAX_RUNTIME_SECONDS: "20000"
        run: python computrabajo_cr_scraper.py

      # ── UPDATED ──────────────────────────────────────────────────────────
      # Now also commits cr_fetch_diagnostics.json, the new file the script
      # writes every time it fetches (or fails to fetch) the homepage. This
      # is the file to check first if locations are ever empty again — it
      # records the exact HTTP status, response headers, and a body snippet,
      # and flags whether the response looks like a Cloudflare/bot-challenge
      # page rather than the real site.
      - name: Commit progress back to the repo
        if: always()   # commit whatever progress was made even if the run errored out
        run: |
          git config user.name "computrabajo-scraper-bot"
          git config user.email "actions@users.noreply.github.com"

          files=()
          for f in cr_processed.csv cr_computrabajo_progress.json cr_scraped_jobs.csv cr_debug.log cr_SCRAPE_COMPLETE.flag cr_homepage_debug.html cr_fetch_diagnostics.json; do
            if [ -f "$f" ]; then
              files+=("$f")
            else
              echo "ℹ️  $f not present this run — skipping."
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️  None of the expected output files exist — the scraper likely failed before writing anything. Check the 'Run scraper' step logs."
            exit 0
          fi

          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No progress changes to commit."
          else
            git commit -m "Scraper progress update [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Report status
        if: always()
        run: |
          if [ -f cr_SCRAPE_COMPLETE.flag ]; then
            echo "✅ All locations fully scraped. Future scheduled runs will exit instantly until the flag file is deleted."
            cat cr_SCRAPE_COMPLETE.flag
          elif [ -f cr_fetch_diagnostics.json ] && grep -q '"outcome": "blocked_or_failed"' cr_fetch_diagnostics.json; then
            echo "🚫 Homepage fetch looked blocked/failed — check cr_fetch_diagnostics.json for the exact status code, headers and body snippet."
          elif [ -f cr_homepage_debug.html ]; then
            echo "🐛 Homepage fetched OK but no location links matched — cr_homepage_debug.html was committed for inspection."
          else
            echo "⏱ Time budget reached (or run ended) before finishing all locations."
            echo "The next scheduled run (within ~15 min) will resume automatically from cr_computrabajo_progress.json."
          fi
